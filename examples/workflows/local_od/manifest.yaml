workflow_id: local-od-demo
title: Verifiable Local OD Workflow Pack
artifact_root: /tmp/astro-assistant
default_scenario: examples/scenarios/leo_two_station_od.yaml
golden_prompts: examples/workflows/local_od/golden_prompts.yaml
supported_scenarios:
  - examples/scenarios/leo_doppler.yaml
  - examples/scenarios/leo_geodetic_eop_table_topocentric.yaml
  - examples/scenarios/leo_geodetic_eop_topocentric.yaml
  - examples/scenarios/leo_geodetic_precession_nutation_topocentric.yaml
  - examples/scenarios/leo_geodetic_topocentric.yaml
  - examples/scenarios/leo_radiometric_links.yaml
  - examples/scenarios/leo_radiometric_media.yaml
  - examples/scenarios/leo_radiometric_weather_frequency.yaml
  - examples/scenarios/leo_two_station_angles.yaml
  - examples/scenarios/leo_two_station_od.yaml
  - examples/scenarios/leo_two_station_topocentric.yaml
steps:
  - validate_scenario
  - synth_measurements
  - export_measurements_tdm
  - estimate_state
artifacts:
  - scenario
  - measurements_json
  - measurements_tdm
  - estimate_json
  - trace_json
  - workflow_report_json
report_metrics:
  - measurement_count
  - tdm_line_count
  - estimate_converged
  - estimate_iterations
  - estimate_rms
  - jacobian_rank
  - residual_count
  - max_abs_residual
policy:
  execution_default: dry_run
  approval_required_for:
    - writes_artifacts
  blocked_in_first_slice:
    - optional_backend
    - arbitrary_shell
